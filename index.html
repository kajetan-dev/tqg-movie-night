<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop – Räume</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1b2230;
    --muted: #5d6676;
    --line: #d8dce4;
    --accent: #2457d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a24;
      --card: #1e2532;
      --text: #eef1f6;
      --muted: #a3acbb;
      --line: #323b4d;
      --accent: #7fa2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 20px; }
  details {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  summary {
    list-style: none;
    cursor: pointer;
    padding: 18px 20px;
    font-size: 1.25rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 56px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "";
    width: 10px; height: 10px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg);
    transition: transform .15s ease;
    margin-right: 4px;
  }
  details[open] summary::after { transform: rotate(-135deg); }
  summary:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .clip { padding: 0 20px 20px; }
  .frame {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
  }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .open {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 1.1rem;
    padding: 16px; border-radius: 8px;
  }
  @media (prefers-color-scheme: dark) { .open { color: #0d1320; } }
  .hint {
    margin: -8px 0 20px;
    padding: 12px 14px;
    border-left: 4px solid var(--accent);
    background: var(--card);
    border-radius: 6px;
    color: var(--muted);
    font-size: .95rem;
    line-height: 1.4;
  }
  .hint ol { margin: 0; padding-left: 1.3em; }
  .hint li + li { margin-top: 6px; }
  .note a { color: var(--accent); }
  .open + .note { margin: 12px 0 0; }
  .note div + div { margin-top: 6px; }
  .note {
    margin: 0 0 12px;
    padding: 10px 12px;
    border-left: 4px solid var(--accent);
    background: var(--bg);
    border-radius: 6px;
    font-size: .95rem;
    line-height: 1.4;
  }
  .times {
    margin: 0 0 12px;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .times span { color: var(--muted); font-weight: 400; }
  .fallback { display: inline-block; margin-top: 10px; font-size: .9rem; color: var(--accent); }
  .missing { color: var(--muted); font-size: .95rem; padding: 8px 0 0; }
  @media (prefers-reduced-motion: reduce) { summary::after { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Movie Night – Wähle einen Raum</h1>
  <div class="hint">
    <ol>
      <li>Bitte öffnet nur den Link zu eurem Raum.</li>
      <li>Bitte beachtet die Start-/Endzeiten über dem Link, <strong>nur dieser Zeitraum</strong> soll performed werden.</li>
    </ol>
  </div>
  <div id="rooms"></div>
</main>

<script>
  // ============ HIER ANPASSEN ============
  // id    = die Video-ID aus dem YouTube-Link (der Teil nach "v=")
  // start = Startsekunde, end = Endsekunde
  // loop  = true: Ausschnitt wiederholt sich automatisch
  // note  = optional: Hinweistext, erscheint über "Start"
  const ROOMS = [
    { name: "2A", id: "4Prc1UfuokY", start: 73, end: 133, loop: true },
    { name: "2C", id: "zAjJYkUnTEs", start: 37, end: 105, loop: true },
    { name: "2D", id: "f2ugRkVMOuE", start: 45, end: 109, loop: true, music: "Musik: Bruce Channel “Hey Baby”", musicLink: "https://open.spotify.com/track/0R2wFVBSGE7elPxW582IWy" },
    { name: "2E", id: "BR93ERmKlzw", start: 114, end: 213, loop: true },
    { name: "2F", id: "BjBswOwKSnk", start: 0, end: 65, loop: true },
    { name: "4B", id: "ZQht2yOX9Js", start: 117, end: 210, loop: true },
    { name: "4E", id: "g4ODPyUxLNw", start: 103, end: 195, loop: true },
    { name: "5A", id: "FWG3Dfss3Jc", start: 54, end: 135, loop: true },
    { name: "5D", id: "5Nhl4f2r8rc", start: 7, end: 64, loop: true },
    { name: "5E", id: "QYVc4v1gfgg", start: 26, end: 150, loop: true, note: "Hinweis: Ignoriert die Ansage zwischen Gespräch und Tanz", music: "Musik: Chuck Berry “You never can tell”", musicLink: "https://open.spotify.com/track/7p6ZGUXjUe0ctAu5RNnghu" },
    { name: "5F", id: "9KQm_7Lpt5E", start: 11, end: 100, loop: true, music: "Musik: James Horner “Rose”", musicLink: "https://open.spotify.com/track/2yEt5pA29CwKNXSplwnhgn" },
    { name: "5H", id: "l4D5zScOFKU", start: 23, end: 107, loop: true },
    { name: "rep", id: "BKIgv8AhffA", start: 57, end: 112, loop: true },
    { name: "single", id: "JcN7Ej6QbAU", start: 74, end: 143, loop: true, note: "Hinweis: Ignoriere alle anderen Personen in der Szene" },
  ];
  // =======================================

  const container = document.getElementById("rooms");

  // Sekunden -> m:ss (z. B. 20 -> 0:20, 75 -> 1:15)
  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = String(sec % 60).padStart(2, "0");
    return m + ":" + s;
  }

  function embedUrl(r) {
    const p = new URLSearchParams({
      start: r.start,
      end: r.end,
      autoplay: 1,
      rel: 0,
      playsinline: 1,
      cc_load_policy: 1
    });
    if (r.loop) { p.set("loop", 1); p.set("playlist", r.id); }
    if (location.protocol === "http:" || location.protocol === "https:") {
      p.set("origin", location.origin);
    }
    return "https://www.youtube.com/embed/" + encodeURIComponent(r.id) + "?" + p.toString();
  }

  ROOMS.forEach(function (r) {
    const d = document.createElement("details");
    const s = document.createElement("summary");
    s.textContent = r.name;
    const body = document.createElement("div");
    body.className = "clip";
    d.append(s, body);

    // Video wird erst beim Aufklappen geladen und beim Zuklappen entfernt:
    // so ist vorher nichts sichtbar, und der Ton stoppt sofort.
    d.addEventListener("toggle", function () {
      body.replaceChildren();
      if (!d.open) return;
      if (!r.id) {
        const m = document.createElement("p");
        m.className = "missing";
        m.textContent = "Noch kein Video hinterlegt.";
        body.append(m);
        return;
      }
      const t = document.createElement("p");
      t.className = "times";
      t.innerHTML = "<span>Start:</span> " + fmt(r.start) + " &nbsp;·&nbsp; <span>Ende:</span> " + fmt(r.end);
      body.append(t);

      // Kein Einbetten: Link öffnet den Clip direkt auf YouTube beim Startpunkt
      const a = document.createElement("a");
      a.className = "open";
      a.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(r.id) + "&t=" + r.start + "s";
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "\u25B6  Filmszene ansehen";
      body.append(a);

      if (r.note || r.music) {
        const n = document.createElement("div");
        n.className = "note";
        if (r.note) {
          const l = document.createElement("div");
          l.textContent = r.note;
          n.append(l);
        }
        if (r.music) {
          const l = document.createElement("div");
          l.textContent = r.music;
          if (r.musicLink) {
            l.append(" (");
            const sa = document.createElement("a");
            sa.href = r.musicLink;
            sa.target = "_blank";
            sa.rel = "noopener";
            sa.textContent = "Spotify";
            l.append(sa, ")");
          }
          n.append(l);
        }
        body.append(n);
      }
    });

    container.append(d);
  });
</script>
</body>
</html>
